name: Relora
options:
  bundleIdPrefix: com.immform
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ReloraKit:
    path: ReloraKit

targets:
  Relora:
    type: application
    platform: iOS
    sources:
      - path: Relora
        excludes:
          - "Fonts/README.md"
    dependencies:
      # The app target is the composition root: it builds the database, the
      # identity controller, and the sync engine before handing everything to
      # ReloraFeatures, so it links each of those products directly.
      - package: ReloraKit
        product: ReloraFeatures
      - package: ReloraKit
        product: ReloraCore
      - package: ReloraKit
        product: ReloraData
      - package: ReloraKit
        product: ReloraDesign
      - package: ReloraKit
        product: ReloraServices
      - package: ReloraKit
        product: ReloraSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immform.relora
        MARKETING_VERSION: "2.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Relora/Info.plist
        # Marks AppIcon in Assets.xcassets as the app icon so the asset
        # compiler injects CFBundleIconName; without it App Store upload
        # fails with ITMS-90713.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Relora/Relora.entitlements
        # Manual signing needs the profile pinned at archive time; gym's
        # export mapping alone is too late. Ignored when
        # CODE_SIGNING_ALLOWED=NO (CI simulator builds).
        DEVELOPMENT_TEAM: SUFCW5V2QV
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: match AppStore com.immform.relora
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

schemes:
  Relora:
    build:
      targets:
        Relora: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
